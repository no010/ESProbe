<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg3" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.5" stop-color="#14213d"/>
      <stop offset="1" stop-color="#0b1324"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#22d3ee" flood-opacity="0.36"/>
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow3" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="1400" height="900" rx="36" fill="url(#bg3)"/>
  <text x="80" y="112" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, Arial" font-size="52" font-weight="800">usbipd-win：把 Windows USB 设备送进 WSL/虚拟机</text>
  <text x="82" y="160" fill="#a5b4fc" font-family="Segoe UI, Microsoft YaHei, Arial" font-size="25">本机 USB 设备 → USBIP Device Host 服务 → WSL 2 / Hyper-V / Linux 客户端</text>

  <g filter="url(#glow)">
    <rect x="90" y="290" width="270" height="250" rx="34" fill="#111827" stroke="#38bdf8" stroke-width="3"/>
    <text x="225" y="352" text-anchor="middle" fill="#e0f2fe" font-family="Segoe UI, Microsoft YaHei, Arial" font-size="32" font-weight="800">Windows 主机</text>
    <text x="225" y="410" text-anchor="middle" fill="#bae6fd" font-family="Segoe UI, Microsoft YaHei, Arial" font-size="24">USB 设备插在本机</text>
    <text x="225" y="455" text-anchor="middle" fill="#93c5fd" font-family="Consolas, monospace" font-size="23">usbipd list</text>
    <text x="225" y="493" text-anchor="middle" fill="#93c5fd" font-family="Consolas, monospace" font-size="23">usbipd bind</text>

    <rect x="565" y="255" width="270" height="320" rx="34" fill="#0f172a" stroke="#22d3ee" stroke-width="4"/>
    <text x="700" y="320" text-anchor="middle" fill="#f0fdfa" font-family="Segoe UI, Microsoft YaHei, Arial" font-size="32" font-weight="800">usbipd-win</text>
    <text x="700" y="375" text-anchor="middle" fill="#ccfbf1" font-family="Segoe UI, Microsoft YaHei, Arial" font-size="24">USBIP Device Host</text>
    <text x="700" y="420" text-anchor="middle" fill="#99f6e4" font-family="Segoe UI, Microsoft YaHei, Arial" font-size="24">服务 + CLI + 防火墙规则</text>
    <rect x="610" y="464" width="180" height="54" rx="27" fill="#22d3ee"/>
    <text x="700" y="500" text-anchor="middle" fill="#082f49" font-family="Consolas, monospace" font-size="24" font-weight="800">TCP 3240</text>

    <rect x="1040" y="290" width="270" height="250" rx="34" fill="#111827" stroke="#a78bfa" stroke-width="3"/>
    <text x="1175" y="352" text-anchor="middle" fill="#ede9fe" font-family="Segoe UI, Microsoft YaHei, Arial" font-size="32" font-weight="800">WSL 2 / VM</text>
    <text x="1175" y="410" text-anchor="middle" fill="#ddd6fe" font-family="Segoe UI, Microsoft YaHei, Arial" font-size="24">Linux 看到真实 USB</text>
    <text x="1175" y="455" text-anchor="middle" fill="#c4b5fd" font-family="Consolas, monospace" font-size="23">usbipd attach --wsl</text>
    <text x="1175" y="493" text-anchor="middle" fill="#c4b5fd" font-family="Consolas, monospace" font-size="23">lsusb / dmesg</text>
  </g>
  <path d="M365 415 H545" stroke="#22d3ee" stroke-width="6" marker-end="url(#arrow3)"/>
  <path d="M845 415 H1025" stroke="#22d3ee" stroke-width="6" marker-end="url(#arrow3)"/>

  <g transform="translate(165 655)">
    <rect width="1070" height="125" rx="30" fill="#020617" stroke="#334155"/>
    <text x="45" y="52" fill="#67e8f9" font-family="Segoe UI, Microsoft YaHei, Arial" font-size="27" font-weight="800">适合哪些开发者场景？</text>
    <text x="45" y="94" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei, Arial" font-size="24">Arduino/DFU 刷机、智能卡、串口设备、ST-LINK、嵌入式 Linux/WSL 调试，以及需要把 USB 穿透给虚拟机的自动化测试。</text>
  </g>
</svg>
